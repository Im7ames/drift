<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f4f4f2">
<title>Drift</title>
<style>
:root{--bg:#f4f4f2;--surf:#fff;--pill:#e7e7e3;--ink:#1b1c1a;--mute:#76786f;--acc:#2f6f5e;--line:#dcdcd6}
@media(prefers-color-scheme:dark){:root{--bg:#171817;--surf:#222422;--pill:#2c2f2c;--ink:#ecece8;--mute:#8b8e85;--acc:#6fc4a8;--line:#333633}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#view{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);background:#fff}
#host{display:block;min-height:100%}
#home{position:absolute;inset:0;padding:calc(18vh) 24px 24px;background:var(--bg);overflow:auto;text-align:center}
#home h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}
#home p{color:var(--mute);margin:0 0 28px}
#hs{width:100%;max-width:420px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;outline:0}
#hs:focus{border-color:var(--acc)}
#ql{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;max-width:420px;margin:34px auto 0}
#ql button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--mute);min-width:0}
#ql b{width:50px;height:50px;border-radius:16px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;color:var(--ink);font-weight:600}
#ql span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top{background:var(--bg);padding-top:env(safe-area-inset-top)}
#strip{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0}
#tl{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none;flex:0 1 auto}
#tl::-webkit-scrollbar{display:none}
.tab{flex:1 1 190px;min-width:120px;max-width:230px;height:36px;display:flex;align-items:center;gap:4px;padding:0 5px 0 13px;border-radius:12px 12px 0 0;color:var(--mute);font-size:13px;cursor:pointer;user-select:none}
.tab.cur{background:var(--surf);color:var(--ink)}
.tab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.tab .x svg{width:13px;height:13px}
#newt{width:36px;height:34px;display:grid;place-items:center;border-radius:10px;flex:none;margin-bottom:1px}
#tool{display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--surf);border-bottom:1px solid var(--line);position:relative}
#tool button{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
#addr{flex:1;min-width:0;margin:0 6px}
#url{width:100%;height:40px;border-radius:20px;border:0;background:var(--pill);padding:0 18px;color:var(--ink);font:inherit;outline:0;text-overflow:ellipsis}
#url:focus{box-shadow:0 0 0 2px var(--acc)}
#star.on svg{fill:var(--acc);stroke:var(--acc)}
#prog{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--acc);opacity:0}
#prog.on{opacity:1;width:80%;transition:width 6s cubic-bezier(.1,.8,.2,1)}
#prog.done{opacity:0;width:100%;transition:width .15s,opacity .4s .15s}
button:disabled{opacity:.3}
button:active{background:var(--pill)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:6;display:flex;align-items:flex-end}
#sheet>div{max-width:520px;margin:0 auto;background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));max-height:75%;overflow:auto;animation:up .2s ease-out}
#sheet button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:12px;text-align:left}
#sheet hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
#sheet .bk{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="strip"><div id="tl"></div><button id="newt" data-i="plus" aria-label="New tab"></button></div>
    <div id="tool">
      <button id="back" data-i="back" aria-label="Back"></button>
      <button id="fwd" data-i="fwd" aria-label="Forward"></button>
      <button id="rl" data-i="reload" aria-label="Reload"></button>
      <form id="addr"><input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address"></form>
      <button id="star" data-i="star" aria-label="Bookmark"></button>
      <button id="menu" data-i="dots" aria-label="Menu"></button>
      <div id="prog"></div>
    </div>
  </header>
  <main id="view">
    <div id="host"></div>
    <div id="home">
      <h1>Drift</h1><p>Search or enter an address</p>
      <input id="hs" placeholder="Search the web" enterkeyhint="go" autocapitalize="off" autocomplete="off">
      <div id="ql"></div>
    </div>
  </main>
  <div id="sheet" hidden><div id="sheetc"></div></div>
  <div id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const IC={back:'M15 18l-6-6 6-6',fwd:'M9 6l6 6-6 6',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',reload:'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',dots:'M5 12h.01M12 12h.01M19 12h.01',star:'M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z',gear:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
document.querySelectorAll('[data-i]').forEach(b=>b.innerHTML=ic(b.dataset.i));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const view=$('#view'),url=$('#url'),shadow=$('#host').attachShadow({mode:'open'});
const SEARCH='https://html.duckduckgo.com/html/?q=';
const PROXIES=['https://api.allorigins.win/raw?url=','https://api.codetabs.com/v1/proxy/?quest=','https://corsproxy.io/?url='];
let tabs=[],cur=0,uid=1,bm=ls.get('bm',[]),cache=new Map();
const mk=(u='')=>({id:uid++,url:u,title:u?hostOf(u):'New tab',hist:u?[{u}]:[],i:u?0:-1});
const T=()=>tabs[cur];
const abs=(u,b)=>{try{return new URL(u,b).href}catch{return u}};
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function norm(s){s=s.trim();if(!s)return'';if(/^https?:\/\//i.test(s))return s;if(!/\s/.test(s)&&/^[^\/?#]+\.[a-z]{2,}([\/:?#]|$)/i.test(s))return'https://'+s;return SEARCH+encodeURIComponent(s)}
const save=()=>ls.set('tabs',{cur,tabs:tabs.map(t=>({url:t.url,title:t.title}))});

/* ---------- networking: fetch + CORS-proxy fallback ---------- */
function tfetch(u,o,sig,ms){const c=new AbortController(),on=()=>c.abort();let to=false;sig.addEventListener('abort',on);const tm=setTimeout(()=>{to=true;c.abort()},ms);
  return fetch(u,{...o,signal:c.signal,credentials:'omit'}).catch(e=>{if(to)e.timeout=true;throw e}).finally(()=>{clearTimeout(tm);sig.removeEventListener('abort',on)})}
async function get(u,o,sig){
  const errs=[];
  try{return await tfetch(u,o,sig,8000)}catch(e){if(sig.aborted)throw e;errs.push(e.timeout?'Direct request timed out':'Direct request blocked by the site (CORS)')}
  const custom=ls.get('proxy',''),list=[custom,...PROXIES].filter(Boolean);
  const via=p=>tfetch(p+encodeURIComponent(u),o,sig,10000).then(r=>{if(!r.ok)throw new Error(hostOf(p)+' answered HTTP '+r.status);return r},e=>{throw new Error(e.message&&/answered/.test(e.message)?e.message:hostOf(p)+(e.timeout?' timed out':' could not be reached'))});
  try{return await Promise.any(list.map(via))}catch(e){if(sig.aborted)throw e;const er=new Error('Could not load '+hostOf(u));er.detail=errs.concat((e.errors||[]).map(x=>x.message));throw er}
}
/* ---------- rendering into a Shadow DOM (no iframes) ---------- */
const BASE=`:host{display:block;background:#fff;color:#111;font:16px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}.__b{min-height:100vh;padding:8px;margin:0}img,video,canvas,svg{max-width:100%;height:auto}table{max-width:100%}pre{overflow:auto}a{color:#1a5fb4}`;
const scope=(css,b)=>css.replace(/@import[^;]+;/g,'')
  .replace(/url\(\s*(['"]?)(?!data:|#)([^'")]+)\1\s*\)/g,(m,q,u)=>`url("${abs(u.trim(),b)}")`)
  .replace(/(^|[,{}\s>+~])(html|body|:root)(?![\w-])/g,(m,a,b)=>a+(b==='body'?'.__b':':host'));
async function render(html,pageUrl,sig){
  const d=new DOMParser().parseFromString(html.slice(0,2e6),'text/html');
  const bh=d.querySelector('base[href]'),base=bh?abs(bh.getAttribute('href'),pageUrl):pageUrl;
  const title=(d.title||'').trim();
  d.querySelectorAll('script,noscript,iframe,frame,object,embed,meta,base,template,link:not([rel~=stylesheet])').forEach(e=>e.remove());
  for(const e of d.querySelectorAll('*')){
    for(const a of [...e.attributes]){
      const n=a.name,v=a.value;
      if(/^on/i.test(n)){e.removeAttribute(n);continue}
      if(n==='srcset'){e.setAttribute(n,v.split(',').map(s=>{s=s.trim().split(/\s+/);s[0]=abs(s[0],base);return s.join(' ')}).join(', '));continue}
      if(/^(href|src|action|poster|formaction|data-src)$/.test(n)){
        if(/^\s*javascript:/i.test(v)){e.removeAttribute(n);continue}
        if(!(n==='href'&&v.startsWith('#')))e.setAttribute(n,abs(v,base));
      }
    }
    if(e.tagName==='IMG'){if(!e.getAttribute('src')&&e.dataset.src)e.src=e.dataset.src;e.loading='lazy';e.decoding='async';e.referrerPolicy='no-referrer'}
    if(e.tagName==='A'){const h=e.getAttribute('href')||'';try{const x=new URL(h);if(/duckduckgo\.com$/.test(x.hostname)&&x.pathname==='/l/'&&x.searchParams.get('uddg'))e.setAttribute('href',x.searchParams.get('uddg'))}catch{}}
  }
  const sheets=[...d.querySelectorAll('style,link[rel~=stylesheet]')];
  const out=await Promise.all(sheets.map(async(s,n)=>{
    const st=document.createElement('style');
    if(s.media)st.media=s.media;
    if(s.tagName==='STYLE')st.textContent=scope(s.textContent,base);
    else if(n<12){try{const r=await get(s.href,{},AbortSignal.timeout(7000));if(r.ok)st.textContent=scope(await r.text(),s.href)}catch{}}
    s.remove();return st;
  }));
  if(sig.aborted)return title;
  const w=document.createElement('div');
  w.className=(d.body.className+' __b').trim();w.id=d.body.id;w.style.cssText=d.body.getAttribute('style')||'';
  w.append(...d.body.childNodes);
  const bs=document.createElement('style');bs.textContent=BASE;
  shadow.replaceChildren(bs,...out,w);
  return title;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- navigation ---------- */
function progress(on){const p=$('#prog');p.className='';if(on){void p.offsetWidth;p.className='on'}else{p.className='done'}}
async function load(u,o={}){
  const t=T();if(!u){return home()}
  t.ctl&&t.ctl.abort();const ctl=t.ctl=new AbortController();
  if(t.i>=0&&t.hist[t.i])t.hist[t.i].s=view.scrollTop;
  $('#home').hidden=true;progress(true);ui();url.value=hostOf(u);
  const post=o.method==='POST';
  try{
    let html=!post&&cache.get(u);
    if(!html){
      const r=await get(u,{method:o.method,body:o.body},ctl.signal);
      const ct=r.headers.get('content-type')||'';
      if(/^image\//.test(ct))html=`<img src="${esc(u)}" style="display:block;margin:auto">`;
      else if(/html|xml/.test(ct)||!ct)html=await r.text();
      else if(/^text\/|json/.test(ct))html='<pre style="white-space:pre-wrap">'+esc(await r.text())+'</pre>';
      else html=`<p style="padding:24px">This file type can’t be shown here. <a href="${esc(u)}" data-ext>Open it directly</a>.</p>`;
      if(!post){cache.set(u,html);if(cache.size>4)cache.delete(cache.keys().next().value)}
    }
    const title=await render(html,u,ctl.signal);
    if(ctl.signal.aborted)return;
    if(o.push!==false){t.hist=t.hist.slice(0,t.i+1);t.hist.push({u});t.i++}
    t.url=u;t.title=title||hostOf(u);
    view.scrollTop=o.scroll||0;
  }catch(e){
    if(ctl.signal.aborted)return;
    shadow.replaceChildren(Object.assign(document.createElement('style'),{textContent:BASE}),Object.assign(document.createElement('div'),{className:'__b',innerHTML:`<div style="padding:18vh 20px;text-align:center"><h2>Can’t open this page</h2><p>${esc(e.message||'Network error')}</p><ul style="text-align:left;display:inline-block;color:#777;font-size:13px">${(e.detail||[]).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p style="color:#777;font-size:14px">If Drift is open inside another app’s preview, network access may be blocked. Open the file directly in your browser, or set a proxy in the menu.</p></div>`}));
    if(o.push!==false){t.hist=t.hist.slice(0,t.i+1);t.hist.push({u});t.i++}
    t.url=u;t.title=hostOf(u);
  }
  progress(false);ui();save();
}
function home(){const t=T();t.ctl&&t.ctl.abort();shadow.replaceChildren();$('#home').hidden=false;url.value='';progress(false);view.scrollTop=0;ui();
  const q=[...bm.slice(0,8)];for(const d of [['Wikipedia','https://en.wikipedia.org'],['Hacker News','https://news.ycombinator.com'],['NPR Text','https://text.npr.org'],['Example','https://example.com']])if(q.length<8&&!q.some(b=>b.u===d[1]))q.push({t:d[0],u:d[1]});
  $('#ql').innerHTML=q.map((b,i)=>`<button data-u="${esc(b.u)}"><b>${esc((b.t||hostOf(b.u))[0].toUpperCase())}</b><span>${esc(b.t||hostOf(b.u))}</span></button>`).join('')}
function renderTabs(){$('#tl').innerHTML=tabs.map((t,i)=>`<div class="tab${i===cur?' cur':''}" data-i="${i}" title="${esc(t.title)}"><span>${esc(t.title)}</span><button class="x" data-x="${i}" aria-label="Close tab">${ic('x')}</button></div>`).join('');const c=$('.tab.cur');c&&c.scrollIntoView({inline:'nearest',block:'nearest'})}
function ui(){const t=T();$('#back').disabled=t.i<0;$('#fwd').disabled=!(t.i<t.hist.length-1);$('#star').classList.toggle('on',!!t.url&&bm.some(b=>b.u===t.url));renderTabs()}
function go(s){const u=norm(s);if(u)load(u);url.blur()}
function back(){const t=T();if(t.i>0){t.hist[t.i].s=view.scrollTop;t.i--;load(t.hist[t.i].u,{push:false,scroll:t.hist[t.i].s})}else if(t.i===0){t.i=-1;t.url='';t.title='New tab';home();save()}}
function fwd(){const t=T();if(t.i<t.hist.length-1){t.hist[t.i].s=view.scrollTop;t.i++;load(t.hist[t.i].u,{push:false,scroll:t.hist[t.i].s})}}
/* Only the active tab keeps a live DOM; others are just {url,title}. Pages come back from a tiny 4-entry cache or the network. */
function show(n){if(tabs[cur]&&tabs[cur].ctl)tabs[cur].ctl.abort();cur=n;const t=T();t.url?load(t.url,{push:false,scroll:t.hist[t.i]&&t.hist[t.i].s}):home();save()}
function newTab(u){tabs.push(mk());cur=tabs.length-1;u?load(u):home();save();return tabs[cur]}
function closeTab(n){tabs[n].ctl&&tabs[n].ctl.abort();tabs.splice(n,1);if(!tabs.length)tabs.push(mk());if(cur>=tabs.length)cur=tabs.length-1;else if(n<cur)cur--;}

/* ---------- link + form handling inside the shadow root ---------- */
shadow.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
  const h=a.getAttribute('href');if(/^(mailto|tel|sms):/i.test(h))return;
  e.preventDefault();
  if(a.hasAttribute('data-ext')){window.open(a.href,'_blank','noopener');return}
  if(h.startsWith('#')){const el=h.length>1&&shadow.getElementById(decodeURIComponent(h.slice(1)));el?el.scrollIntoView():view.scrollTo(0,0);return}
  if(a.target==='_blank'){const n=cur;newTab(h);toast('Opened in new tab');return}
  load(h);
});
shadow.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;let fd;try{fd=new FormData(f,e.submitter)}catch{fd=new FormData(f)}
  const p=new URLSearchParams();fd.forEach((v,k)=>typeof v==='string'&&p.append(k,v));
  const act=f.getAttribute('action')||T().url;
  if((f.method||'get').toLowerCase()==='post')load(act,{method:'POST',body:p});
  else{const x=new URL(act);p.forEach((v,k)=>x.searchParams.set(k,v));load(x.href)}
});

/* ---------- chrome UI ---------- */
$('#addr').onsubmit=e=>{e.preventDefault();go(url.value)};
url.onfocus=()=>{url.value=T().url;setTimeout(()=>url.select(),0)};
url.onblur=()=>{const t=T();url.value=t.url?hostOf(t.url):''};
$('#hs').onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};
$('#ql').onclick=e=>{const b=e.target.closest('button');if(b)load(b.dataset.u)};
$('#rl').onclick=()=>{const t=T();if(t.url){cache.delete(t.url);load(t.url,{push:false,scroll:view.scrollTop})}};
$('#back').onclick=back;$('#fwd').onclick=fwd;
$('#newt').onclick=()=>{newTab();$('#hs').focus()};
$('#tl').onclick=e=>{
  const x=e.target.closest('[data-x]');
  if(x){const n=+x.dataset.x,hadCur=n===cur;closeTab(n);if(hadCur)show(cur);else{save();ui()}return}
  const c=e.target.closest('.tab');if(c&&+c.dataset.i!==cur)show(+c.dataset.i)
};
$('#tl').addEventListener('wheel',e=>{if(e.deltaY){$('#tl').scrollLeft+=e.deltaY}},{passive:true});
$('#star').onclick=()=>{const t=T();if(!t.url)return;const i=bm.findIndex(x=>x.u===t.url);i>=0?(bm.splice(i,1),toast('Bookmark removed')):(bm.push({u:t.url,t:t.title}),toast('Bookmarked'));ls.set('bm',bm);ui()};
function openMenu(){
  const t=T(),has=t.url,saved=bm.some(b=>b.u===t.url);
  $('#sheetc').innerHTML=`<button data-a="new">${ic('plus')}New tab</button>
  <button data-a="bm" ${has?'':'disabled'}>${ic('star')}${saved?'Remove bookmark':'Bookmark this page'}</button>
  <button data-a="proxy">${ic('gear')}Set CORS proxy</button>
  <button data-a="clear">${ic('trash')}Clear page cache and bookmarks</button>
  ${bm.length?'<hr>'+bm.map((b,i)=>`<button class="bk" data-b="${i}">${esc(b.t||hostOf(b.u))}</button>`).join(''):''}`;
  $('#sheet').hidden=false}
$('#menu').onclick=openMenu;
$('#sheet').onclick=e=>{
  const s=$('#sheet');if(e.target===s){s.hidden=true;return}
  const b=e.target.closest('button');if(!b)return;s.hidden=true;const t=T();
  if(b.dataset.b!==undefined)return load(bm[+b.dataset.b].u);
  switch(b.dataset.a){
    case'new':newTab();$('#hs').focus();break;
    case'bm':{const i=bm.findIndex(x=>x.u===t.url);i>=0?(bm.splice(i,1),toast('Bookmark removed')):(bm.push({u:t.url,t:t.title}),toast('Bookmarked'));ls.set('bm',bm);ui();break}
    case'proxy':{const p=prompt('Proxy URL prefix (the page URL is appended, encoded). Leave empty for defaults.',ls.get('proxy',''));if(p!==null)ls.set('proxy',p.trim());break}
    case'clear':cache.clear();bm=[];ls.set('bm',[]);toast('Cleared');break;
  }
};
/* edge swipes: left edge = back, right edge = forward */
let sx=null,sy=0;
view.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;sx=(x<22||x>innerWidth-22)?x:null;sy=e.touches[0].clientY},{passive:true});
view.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);if(dy<60&&dx>80&&sx<22)back();else if(dy<60&&dx<-80)fwd();sx=null});
/* low-memory hygiene: drop cached pages when the tab is hidden */
document.addEventListener('visibilitychange',()=>{if(document.hidden)cache.clear()});
